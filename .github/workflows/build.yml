name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that all project files are uploaded
        run: |
          missing=0
          while IFS= read -r f; do
            if [ ! -f "$f" ]; then
              echo "MISSING: $f"
              missing=1
            fi
          done < required-files.txt
          if [ "$missing" = "1" ]; then
            echo "Some files were not uploaded. Upload the missing files and commit again."
            exit 1
          fi
          echo "All project files are present."

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: arcane-staff-mod
          path: build/libs/*.jar
